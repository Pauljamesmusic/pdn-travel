services:
  - type: web
    name: pdn-travel
    runtime: node
    plan: free
    region: oregon
    healthCheckPath: /api/health
    # db:push syncs the schema without dropping data; db:seed only fills in a genuinely
    # empty database (or the owner account, if that's the only thing missing) — neither
    # step ever touches existing content, so admin edits survive every deploy.
    buildCommand: npm install --include=dev && npm run db:push -w apps/api && npm run db:seed -w apps/api && npm run build
    startCommand: npm run start -w apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./prod.db
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: WEB_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: PDN Admin
