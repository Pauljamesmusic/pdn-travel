services:
  - type: web
    name: pdn-travel
    runtime: node
    plan: free
    region: oregon
    healthCheckPath: /api/health
    buildCommand: npm install --include=dev && npm run build && npm run db:push -w apps/api && npm run db:seed -w apps/api
    startCommand: npm run start -w apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./prod.db
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: WEB_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: PDN Admin
